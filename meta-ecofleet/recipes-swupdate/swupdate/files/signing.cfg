# Enable SWUpdate bundle signature verification.
#
# make-swu.sh signs sw-description with:  openssl dgst -sha256 -sign sign.key
# which is RSA PKCS#1 v1.5 over SHA-256 == SWUpdate's RAWRSA algorithm.
#
# The device verifies with the PUBLIC KEY (not the cert) extracted from
# sign.crt and installed at /etc/swupdate/sign.pub by the swupdate-keys recipe;
# gobi-agent's OTA path passes it via `swupdate -k /etc/swupdate/sign.pub`.
#
# With this enabled, an unsigned or wrongly-signed bundle is rejected and the
# update aborts (the device stays on its current slot — safe failure).
CONFIG_HASH_VERIFY=y
CONFIG_SIGNED_IMAGES=y
# CONFIG_SIGALG_CMS is not set
# CONFIG_SIGALG_RSAPSS is not set
CONFIG_SIGALG_RAWRSA=y
