globals :
{
    verbose = true;
    loglevel = 5;
    syslog = true;

    /* RSA (RAWRSA) bundle verification uses the PUBLIC KEY — extracted from
     * sign.crt and installed as sign.pub by the swupdate-keys recipe. Passing
     * the cert here fails to load (openssl: "Could not find public key"). */
    public-key-file = "/etc/swupdate/sign.pub";
};

download :
{
    /* gobi-agent invokes swupdate directly; no built-in downloader needed */
    retries = 3;
    timeout = 300;
};

identify :
[
    { name = "hardware"; value = "imx8mm-var-dart"; },
    { name = "vendor";   value = "ecofleet"; },
];
