# U-Boot console on R1's USB-C port as well as UART1 (stdout=serial,usbacm).
# R1's UART1 is wired to the Ezurio module; the board code (0004) turns the USB
# console on for R1 only and stops it before the kernel (ft_board_setup).
CONFIG_USB_FUNCTION_ACM=y
CONFIG_CONSOLE_MUX=y
CONFIG_SYS_CONSOLE_IS_IN_ENV=y
CONFIG_OF_BOARD_SETUP=y
