# The unit is online once ANY link has a routable address. The stock unit waits
# for every managed link, so a truck without the Ethernet cable (or without
# WiFi set up) sat out the 2-minute timeout before gobi-agent could start.
# "routable" so an IPv6 link-local address alone doesn't count.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --operational-state=routable
