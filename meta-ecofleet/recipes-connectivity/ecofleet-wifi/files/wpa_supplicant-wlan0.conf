# EcoFleet: WiFi credentials live on /data so they survive A/B updates, and
# WiFi only starts on units that have been given them. Provision with:
#   mkdir -p /data/wifi
#   printf 'ctrl_interface=/run/wpa_supplicant\nupdate_config=1\ncountry=US\n' > /data/wifi/wpa_supplicant-wlan0.conf
#   wpa_passphrase "<SSID>" >> /data/wifi/wpa_supplicant-wlan0.conf   (then delete the #psk= line)
#   chmod 600 /data/wifi/wpa_supplicant-wlan0.conf
[Unit]
ConditionPathExists=/data/wifi/wpa_supplicant-wlan0.conf
RequiresMountsFor=/data

[Service]
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c/data/wifi/wpa_supplicant-wlan0.conf -i%I
