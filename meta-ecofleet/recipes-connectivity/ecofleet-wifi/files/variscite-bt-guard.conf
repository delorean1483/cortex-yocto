# Bluetooth shares the IW612 with WiFi, and its UART (UART4, ttymxc3) used to
# carry the kernel console too. With both on that port the board hard-hung a
# few seconds after WiFi associated (bench 2026-09-30). With the console off
# the port, BT + WiFi passed reconnect soaks with BLE scanning (2026-10-07).
#
# u-boot always runs slot A's boot.scr, so a unit can boot this rootfs with an
# older script that still says console=ttymxc3. Start BT only when it doesn't.
[Unit]
ConditionKernelCommandLine=!console=ttymxc3,115200

[Service]
# Never tear BT down: stopping pulls BT_EN low with WiFi firmware still
# running on the same chip. Nothing needs it on shutdown.
ExecStop=
