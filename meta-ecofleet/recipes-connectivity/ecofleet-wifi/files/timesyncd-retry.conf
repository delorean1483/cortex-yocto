# Retry the time servers 5 s after a deferred attempt, not 30 s. At boot
# timesyncd tries every server before the network is up (each lookup fails at
# once), hits its limit of 10 attempts per 10 s, and defers the network-up
# events by this delay, so the first sync came 30 s after the unit was online.
# When the RTC has lost its time, gobi-agent waits for that sync.
[Time]
ConnectionRetrySec=5
