# psplash-start is Type=simple, so systemd starts psplash-systemd before psplash
# has created /run/psplash_fifo; psplash-systemd then fails ("unable to open
# fifo") and the boot bar never advances. Wait up to 5 s for the fifo.
[Service]
ExecStartPre=/bin/sh -c "n=0; while [ ! -p /run/psplash_fifo ] && [ $n -lt 50 ]; do sleep 0.1; n=$((n+1)); done"
